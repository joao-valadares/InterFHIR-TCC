      org.interfhir.root: ${INTERFHIR_ROOT:?Use npm run e2e:up}
      org.interfhir.project: ${INTERFHIR_PROJECT_NAME:?Use npm run e2e:up}
  clinic-b-metadata-postgres:
    ports:
      - 127.0.0.1:${INTERFHIR_CLINIC_B_METADATA_HOST_PORT:-5435}:5432
